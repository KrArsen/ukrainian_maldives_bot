version: "3.8"

services:
  bot:
    build: .
    container_name: maldivi_bot
    restart: always
    volumes:
      # Mount SQLite database and .env file to persist data and configuration
      - ./bot.db:/app/bot.db
      - ./.env:/app/.env
    environment:
      - TZ=Europe/Kyiv

  # PostgreSQL database (Optional: if you decide to switch from SQLite to PostgreSQL in the future)
  db:
    image: postgres:16
    container_name: maldivi_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maldivi_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: maldivi_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
